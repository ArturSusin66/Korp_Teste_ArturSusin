version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: korp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: EstoqueDb
      MYSQL_USER: korp
      MYSQL_PASSWORD: senha123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - korp-network

volumes:
  mysql_data:

networks:
  korp-network:
    driver: bridge
